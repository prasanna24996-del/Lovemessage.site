# Love-message.html
<!DOCTYPE html>
<html>
<head>
  <title>I Love You</title>
  <style>
    body {
      background-image: url('https://example.com/background.jpg');
      background-size: cover;
      font-family: Arial;
    }
    .message {
      font-size: 50px;
      color: #fff;
      text-align: center;
      margin-top: 20%;
      text-shadow: 2px 2px 4px #000;
    }
    .heart {
      color: red;
      font-size: 70px;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="message">I Love You Vamshi <span class="heart">❤️</span></div>
</body>
</html>
